name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Import + demo smoke
        run: |
          python -c "from minutes.extractor import extract; from minutes.server import create_app; print('ok')"
          minutes version
          minutes extract -f minutes/sample_transcript.txt --heuristic -F json -o /tmp/out.json
          python -c "import json; d=json.load(open('/tmp/out.json')); assert 'action_items' in d; assert 'decisions' in d; print(len(d['action_items']), 'actions')"
