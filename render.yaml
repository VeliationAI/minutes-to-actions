services:
  - type: web
    name: minutes-to-actions
    runtime: python
    plan: free
    region: oregon
    branch: main
    buildCommand: pip install -r requirements.txt && pip install -e .
    startCommand: uvicorn minutes.server:create_app --factory --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: OPENAI_API_KEY
        sync: false
      - key: MINUTES_MODEL
        value: gpt-4o-mini
